name: Keep Render backend awake

# Render's free tier spins the service down after ~15 min of no incoming
# requests, and the next request pays a 20-60s (sometimes failing) cold
# start. This pings /health every 10 minutes so the dyno never goes idle
# long enough to sleep. Safe to delete once the Render plan no longer
# spins down (e.g. after upgrading off the free tier).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sS --max-time 60 -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" https://quickhands-api.onrender.com/health
